apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpt-live-voice-service
  namespace: ai-voice
  labels:
    app: gpt-live-voice
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gpt-live-voice
  template:
    metadata:
      labels:
        app: gpt-live-voice
    spec:
      containers:
        - name: voice-gateway
          image: ghcr.io/pradeeptalari14/gpt-live-voice-api:latest
          command: ["python3", "gpt_live_voice_agent.py"]
          resources:
            limits:
              memory: 2Gi
              cpu: "2"
            requests:
              memory: 512Mi
              cpu: "500m"
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gpt-live-voice-service
  namespace: ai-voice
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: gpt-live-voice
